version: "3.8"

services:
  # ── Vector Store ──────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.12.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    expose:
      - "6333"
    volumes:
      - ./infra/qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333 && echo -e 'GET / HTTP/1.0\r\n\r\n' >&3 && cat <&3 | grep -q qdrant"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ───────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - CONFIG_DIR=/app/config
      - APP_ENV=${APP_ENV:-dev}
      # Pin the control-store SQLite db onto the mounted ./artifacts volume.
      # Without this it resolves to /artifacts (container root, ephemeral) and
      # every rebuild wipes the switch/thresholds/alerts. See control_store.py.
      - CONTROL_DB_PATH=/app/artifacts/control/control.db
      # .env's QDRANT_URL is a local-dev-only override (host running outside
      # Docker); force the in-network hostname here so it always wins over
      # env_file, regardless of what a developer's .env sets.
      - QDRANT_URL=http://qdrant:6333
    ports:
      # Host port 8001 (not 8000) — matches the homelab's existing local
      # binding. Container-internal port stays 8000: telegram-bot, cloudflared
      # and the in-network API_URL=http://api:8000 all talk to it unaffected.
      - "127.0.0.1:8001:8000"
    expose:
      - "8000"
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
      - ./artifacts:/app/artifacts
    command: uv run uvicorn habitantes.infrastructure.api.main:app --host 0.0.0.0 --port 8000 --workers 1

  # ── Telegram Bot ──────────────────────────────────────────────────────────
  telegram-bot:
    build:
      context: .
      dockerfile: app/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - CONFIG_DIR=/app/config
      - APP_ENV=${APP_ENV:-dev}
      # .env's API_URL is a local-dev-only override (host running outside
      # Docker); force the in-network hostname here so it always wins over
      # env_file, regardless of what a developer's .env sets.
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./config:/app/config
    command: uv run python /app/app/telegram_bot.py

  # ── WhatsApp Bot (Baileys, Node) ──────────────────────────────────────────
  # Parked in favor of the official Cloud API webhook (see routers/webhooks.py).
  # Kept in the repo, not deleted — just excluded from a plain `docker compose up`.
  # Re-enable with: docker compose --profile baileys up
  whatsapp-bot:
    profiles: ["baileys"]
    build:
      context: .
      dockerfile: app/whatsapp_bot/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - APP_ENV=${APP_ENV:-dev}
      - CONFIG_DIR=/app/config
      - API_URL=http://api:8000          # in-network host wins over .env
      # ADMIN_TOKEN + WHATSAPP_ID_SALT come from .env (heartbeat auth + JID hashing)
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./config:/app/config             # read base.yaml
      - ./artifacts:/app/artifacts       # persist auth session (git-ignored)

  # ── Cloudflare Tunnel ─────────────────────────────────────────────────────
  # Public HTTPS ingress for the WhatsApp Cloud API webhook (Meta must POST to
  # us — see routers/webhooks.py). Dials OUT to Cloudflare's edge, so no port
  # is published here and no firewall rule changes on the homelab.
  #
  # Set up once in the Cloudflare Zero Trust dashboard: add idwt.cloud (Free
  # plan), create a named tunnel, copy its token into .env as
  # CLOUDFLARE_TUNNEL_TOKEN, then add a Public Hostname rule. Recommended:
  # scope it to the webhook path only (Hostname: bot.idwt.cloud, Path:
  # webhooks/*, Service: http://api:8000) rather than the whole API — /admin/*
  # is token-guarded either way, but there's no reason to expose it to the
  # internet at all when only /webhooks/whatsapp needs to be public.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # Token passed as an explicit CLI arg (Cloudflare's own documented `docker
    # run` invocation) rather than via a TUNNEL_TOKEN env var — the latter
    # isn't reliably picked up by `tunnel run` on current cloudflared builds
    # and the container just crash-loops with "requires the ID or name of
    # the tunnel to run".
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      api:
        condition: service_started

networks:
  default:
    name: expat-network
