# ── Global Defaults ──────────────────────────────────────────────────────────
llm:
  # Chat/completions via OpenRouter. model_name is a `provider/model` OpenRouter
  # id — swap models here (or via MODEL_NAME env) with no code change.
  model_name: "google/gemini-2.5-flash-lite"
  base_url: "https://openrouter.ai/api/v1"
  # Judge model for eval (answer_relevance/faithfulness) — one tier above the
  # chat model for better judgment quality, still cheap.
  judge_model_name: "google/gemini-2.5-flash"
  # Embeddings stay on OpenAI (OpenRouter has no embeddings endpoint).
  embedding_model_name: "text-embedding-3-small"

vector_store:
  qdrant_url: "http://qdrant:6333"
  qdrant_timeout_seconds: 3

api:
  rate_limit_per_hour: 100
  max_tokens_per_response: 1024
  request_timeout_seconds: 30
  openai_timeout_seconds: 8

telegram:
  api_url: "http://api:8000"
  rate_limit_per_minute: 5
  max_message_length: 2000

# ── WhatsApp (Cloud API) channel — DM-only, official/sanctioned transport ────
# Webhook-based, lives inside the API process (routers/webhooks.py) and IS read
# by the Python API. Secrets (WHATSAPP_BUSINESS_TOKEN, WHATSAPP_PHONE_NUMBER_ID,
# WHATSAPP_WABA_ID, WHATSAPP_APP_SECRET, WHATSAPP_VERIFY_TOKEN) are env-only —
# see .env.example.
# WHATSAPP_ID_SALT must never be rotated: it derives every migrated user's
# chat_id from their phone number (wa_id), so rotating it breaks existing
# users' conversation memory and feedback history.
whatsapp_cloud:
  rate_limit_per_minute: 5
  max_message_length: 2000
  id_hash_length: 16 # hex chars kept from the SHA-256 digest
  graph_api_base: "https://graph.facebook.com"
  graph_api_version: "v23.0"
  request_timeout_seconds: 10
  # Gratitude replies that count as a 👍 on the last answer. Matched on a
  # normalized (lowercased, accent-stripped, punctuation-trimmed) message.
  # Extend freely here — no code change needed.
  feedback_positive_keywords:
    # Portuguese
    - "obrigado"
    - "obrigada"
    - "obg"
    - "obgd"
    - "brigado"
    - "brigada"
    - "valeu"
    - "vlw"
    - "agradecido"
    - "agradecida"
    - "gratidao"
    - "muito obrigado"
    - "muito obrigada"
    - "ajudou"
    - "ajudou muito"
    - "top"
    - "perfeito"
    - "show"
    - "otimo"
    - "maravilha"
    # English
    - "thanks"
    - "thank you"
    - "thx"
    - "ty"
    - "tks"
    - "cheers"
    - "appreciate it"
    - "great"
    - "perfect"
    # French
    - "merci"
    - "merci beaucoup"
    - "mercii"
    - "parfait"
    # Spanish
    - "gracias"
    - "muchas gracias"
    # Emoji-only replies
    - "🙏"
    - "👍"
    - "❤️"
    - "🥰"

# ── Search & Ranking (single source of truth for tuning) ─────────────────────
search:
  dense_prefetch_k: 80
  sparse_prefetch_k: 120
  fused_k: 50
  top_k: 5
  w_dense: 0.7
  w_sparse: 0.3
  rrf_k: 60
  # Relevance gate: minimum dense cosine similarity (query↔stored question) for a
  # chunk to be kept. If no chunk clears this floor the agent returns the no-results
  # fallback without an LLM synthesis call. This is a *backstop* — clearly off-topic
  # queries are already rejected upstream by intent classification (out_of_scope),
  # so this floor only guards qa/both-intent questions with weak retrieval (the
  # Suggestions collection has its own floor: suggestions.min_relevance).
  # Tuned for OpenAI text-embedding-3-small: on the 38-case golden set the lowest
  # true-positive top dense = 0.6504 (with category filter). 0.55 leaves ~0.10 margin
  # so the agent's query rephrasing can't gate real matches, while still dropping
  # genuinely weak retrievals.
  min_relevance: 0.55

ranking:
  anchor_bonus: 0.05
  rerank_top_k: 40
  date_decay_lambda: 0.0005
  min_token_length: 4

# ── Web search (Tavily) — lower-priority, Grenoble-scoped secondary source ────
# Preferred sources are the Qdrant collections (Q&A and Suggestions); web is used for factual/current/
# generalist Grenoble info or to confirm possibly-outdated facts. TAVILY_API_KEY
# is env-only (see .env.example); a missing key disables the tool (no crash).
web_search:
  enabled: true
  max_results: 3
  search_depth: "advanced" # "basic" | "advanced"
  topic: "general" # tavily topic
  location_suffix: "Grenoble France" # appended to enforce geo scope
  timeout_seconds: 8
  answer_confidence: 0.5 # confidence assigned to a web-only (no-KB) answer
  api_url: "https://api.tavily.com/search"

# ── Agent orchestration ──────────────────────────────────────────────────────
agent:
  max_react_iterations: 8
  max_history: 5
  temperature: 0.0

# ── Response cache ───────────────────────────────────────────────────────────
cache:
  enabled: true
  max_size: 256
  ttl_seconds: 3600

# ── Suggestions (community recommendations; shared by ingestion + agent) ─────
# Parallel to the Q&A pipeline: `make mentions` (windows -> Jev -> extraction) then
# `make suggestions` (merge -> opt-out -> Clusters -> rebuild this collection).
# The agent reads it through `search_suggestions` (intent `recommendation`/`both`).
# Businesses that opt out go in config/suggestion_exclusions.txt, not here.
# The merge/label/extraction LLM defaults (google/gemini-2.5-flash-lite) live in
# ingestion/config.py (`mention_extraction`, `suggestion_llm`); override them by adding
# those keys under `ingestion:` below. Window sizes are untuned until the
# labelled sample is measured (docs/SUGGESTIONS_EVAL.md).
suggestions:
  collection_name: "habitantes_suggestions_kb" # new collection, independent of the Q&A one
  window_before: 5 # messages before a trigger message
  window_after_request: 15 # messages after a request ("quem indica...") trigger
  window_after_other: 5 # messages after any other trigger
  jev_cutoff: 0.92 # min P(yes) from Jev for a window; calibrated on proxy labels (docs/SUGGESTIONS_EVAL.md)
  similarity_cutoff: 0.5 # min Item/Context similarity for Mentions to share a Cluster
  ranking_half_life_years: 2.0 # Mentions older than this count half
  summary_size: 5 # top members named in a Cluster summary ("+K outras" for the rest)
  max_clusters: 6 # max Clusters shown by search_suggestions (members are merged across them)
  candidate_clusters: 10 # Clusters fetched per search branch, then merged member-by-member
  max_members: 20 # total members shown across the returned Clusters (deduped by name)
  min_relevance: 0.55 # dense cosine floor for search_suggestions hits

# ── Observability ───────────────────────────────────────────────────────────
logging:
  interaction_path: "logs/interactions.jsonl"
  rotation: "10 MB"
  retention: "30 days"

# ── Control Center (ops dashboard, kill switch, cost alerting) ───────────────
admin:
  # ADMIN_TOKEN env var only — never a plaintext default in yaml

pricing:
  # Per-model USD rates — MUST be updated if llm.model_name changes, since cost
  # tracking multiplies token counts by these. Values below are
  # google/gemini-2.5-flash-lite (OpenRouter list price).
  input_per_1m_usd: 0.10
  output_per_1m_usd: 0.40

alerts:
  interval_seconds: 60
  daily_cost_limit_usd: 5.0
  monthly_budget_usd: 120.0
  health_grace_checks: 3
  auto_disable_enabled: true
  # email_to / smtp_host / smtp_port / smtp_user / smtp_from / SMTP_PASSWORD
  # are env-only (see .env.example) — they identify a real mailbox, so they
  # never go in a checked-in file.
  # Channels the watchdog expects a heartbeat from. The WhatsApp Cloud API
  # webhook has no poll loop of its own (it lives inside the API process), so
  # it needs no heartbeat entry here.
  heartbeat_services: ["telegram_bot"]

