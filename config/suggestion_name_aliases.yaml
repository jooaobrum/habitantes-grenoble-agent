# Manual name decisions for the Suggestions name grouping (ingestion/suggestions/name_groups.py).
# Applied after the automatic rules, on every rebuild.
#
# keep:     named businesses whose words look generic ("Snack Brasil"): never dropped.
# kind:     (optional, inside a `same` entry) the Kind this business always gets, instead of
#           the Kind where it has the most Mentions.
# same:     names (or regex on the normalised name: lower case, no accents) that are ONE business.
#           A name matched here is never dropped as generic.
# separate: pairs that are different businesses even if their spellings are close.
keep: ["Snack Brasil", "Pizza 51", "O'Tacos", "Thai Express", "C&A", "BK", "U", "U (supermercado)"]
same:
  - canonical: "Kabuki Canton"
    names: ["Kabuki", "Kabuki Canton"]
  - canonical: "Bombay Talkies"
    names: ["Bombay", "Bombay Talkies"]
  - canonical: "O'Callaghan"
    names: ["O'Callaghan", "O'Callaghan Irish Pub"]
  - canonical: "Médecins 7/7"
    names: ["Médecins 7/7", "Medecin 7/7", "médecin 7/7", "7/7"]
  - canonical: "Casa Barriolatino"      # all these spellings are one business
    names: ["Casa Barriolatino", "Barrio Latino", "Barril Latino", "Bairro Latino"]
  - canonical: "CROUS (restaurantes universitários)"
    kind: "Restaurants & Bars"
    names: ["Diderot", "CROUS"]
    match: ["\\bcrous\\b", "\\bru\\b", "resto universitaire", "restaurante universitario", "restaurant universitaire"]
separate:
  - ["Come Va", "Come Prima"]
  - ["Chez Marius", "Bouillon Archers Chez Marius"]
